
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c62828">
  <meta name="description" content="FireGuard uydu tabanlı yangın izleme">
  <title>FireGuard</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
    }
    header {
      padding: 22px 18px;
      background: #c62828;
    }
    h1 { margin: 0; font-size: 28px; }
    main { padding: 20px; }
    .card {
      background: #1d2a35;
      padding: 18px;
      margin: 14px 0;
      border-radius: 14px;
    }
    a {
      display: inline-block;
      background: #c62828;
      color: white;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 9px;
      margin-top: 10px;
    }
    small { color: #c4d0da; }
  </style>
</head>
<body>
  <header>
    <h1>🔥 FireGuard</h1>
    <p>Uydu tabanlı yangın izleme</p>
  </header>
  <main>
    <div class="card">
      <h2>Yangın izleme paneli</h2>
      <p>Mevcut FireGuard haritasını açarak tespitleri inceleyebilirsin.</p>
      <a href="https://fireguard-wildfire-monitoring.purdekudret.workers.dev/">
        Haritayı aç
      </a>
    </div>
    <div class="card">
      <h3>Veri güvenliği</h3>
      <small>Uydu sıcak nokta tespitleri doğrulanmış yangın anlamına gelmez.</small>
    </div>
  </main>
</body>
</html>
